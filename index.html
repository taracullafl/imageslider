<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Image Comparison Slider</title>

  <!-- Oswald Bold -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg: #0b0f17;
      --cardRadius: 18px;
      --cardShadow: 0 18px 55px rgba(0,0,0,0.35);

      /* glass */
      --glass: rgba(255,255,255,0.10);
      --glass2: rgba(255,255,255,0.06);

      --text: rgba(255,255,255,0.95);
      --muted: rgba(255,255,255,0.78);

      --accent: #C0FF00;
      --accent75: rgba(192,255,0,0.75);
      --focus: rgba(255,255,255,0.85);
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      min-height:100svh;
      display:grid;
      place-items:center;
      background:
        radial-gradient(1200px 800px at 20% 10%, rgba(192,255,0,0.10), transparent 60%),
        radial-gradient(1200px 800px at 80% 90%, rgba(61,214,208,0.08), transparent 60%),
        var(--bg);
      color: var(--text);
      padding: 24px;
      font-family: Arial, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    .wrap{ width: min(980px, 96vw); }

    .card{
      border-radius: var(--cardRadius);

      /* CHANGED: card background to white */
      background: #ffffff;

      /* CHANGED: subtle border for white card */
      border: 1px solid rgba(15, 23, 42, 0.10);

      box-shadow: var(--cardShadow);
      overflow:hidden;
      padding: 14px;

      /* CHANGED: text colour inside the card */
      color: #0f172a;
    }

    .slider{
      position: relative;
      border-radius: 14px;
      overflow:hidden;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.10);
      min-height: 280px;
      height: min(60vh, 520px);
      width: 100%;
      user-select: none;
      touch-action: none;
    }

    .imgLayer{
      position:absolute;
      inset:0;
    }

    .imgLayer img{
      width:100%;
      height:100%;
      object-fit: cover;
      display:block;
      -webkit-user-drag: none;
      user-select: none;
      pointer-events: none;
    }

    .afterLayer{
      clip-path: inset(0 calc(100% - var(--pos)) 0 0);
      will-change: clip-path;
    }

    .divider{
      position:absolute;
      top:0;
      bottom:0;
      left: var(--pos);
      width: 2px;
      transform: translateX(-1px);
      background: rgba(255,255,255,0.55);
      box-shadow: 0 0 18px rgba(0,0,0,0.35);
      pointer-events:none;
    }

    .handle{
      position:absolute;
      top: 50%;
      left: var(--pos);
      transform: translate(-50%, -50%);
      width: 56px;
      height: 56px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.22);
      background: linear-gradient(180deg, var(--glass), var(--glass2));
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 18px 45px rgba(0,0,0,0.35);
      display:grid;
      place-items:center;
      cursor: grab;
    }
    .handle:active{ cursor: grabbing; }
    .handle:focus-visible{
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }

    .handle svg{
      width: 28px;
      height: 28px;
      opacity: 0.95;
      filter: drop-shadow(0 2px 10px rgba(0,0,0,0.35));
    }

    .label{
      position:absolute;
      bottom: 12px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.18);
      background: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.06));
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 14px 34px rgba(0,0,0,0.28);
      font-family: "Oswald", Arial, sans-serif;
      font-weight: 700;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      font-size: 14px;
      color: rgba(255,255,255,0.95);
    }
    .label.before{ left: 12px; }
    .label.after{ right: 12px; }

    .srOnly{
      position:absolute;
      width:1px;
      height:1px;
      padding:0;
      margin:-1px;
      overflow:hidden;
      clip:rect(0,0,0,0);
      white-space:nowrap;
      border:0;
    }

    @media (max-width: 520px){
      body{ padding: 16px; }
      .card{ padding: 12px; }
      .slider{ height: min(62vh, 440px); min-height: 260px; }
      .handle{ width: 52px; height: 52px; }
      .label{ font-size: 13px; padding: 7px 10px; }
    }

    @media (prefers-reduced-motion: reduce){
      .afterLayer{ will-change: auto; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <div
        class="slider"
        id="slider"
        role="group"
        aria-label="Before and after image comparison slider"
        style="--pos: 50%;"
      >
        <p class="srOnly" id="instructions">
          Drag the handle left or right to compare the before and after images.
          You can also use the left and right arrow keys when the handle is focused.
        </p>

        <div class="imgLayer beforeLayer" aria-hidden="true">
          <img
            src="https://images.unsplash.com/photo-1523413651479-597eb2da0ad6?auto=format&fit=crop&w=1600&q=80"
            alt=""
          />
        </div>

        <div class="imgLayer afterLayer" aria-hidden="true">
          <img
            src="https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1600&q=80"
            alt=""
          />
        </div>

        <div class="divider" aria-hidden="true"></div>

        <button
          class="handle"
          id="handle"
          type="button"
          aria-describedby="instructions"
          aria-label="Image comparison handle"
        >
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M10 7L6 12l4 5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M14 7l4 5-4 5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <div class="label before" aria-hidden="true">BEFORE</div>
        <div class="label after" aria-hidden="true">AFTER</div>
      </div>
    </div>
  </div>

  <script>
    const slider = document.getElementById("slider");
    const handle = document.getElementById("handle");

    let dragging = false;

    function clamp(n, min, max){ return Math.max(min, Math.min(max, n)); }

    function setPosFromClientX(clientX){
      const rect = slider.getBoundingClientRect();
      const x = clamp(clientX - rect.left, 0, rect.width);
      const pct = (x / rect.width) * 100;
      slider.style.setProperty("--pos", pct.toFixed(2) + "%");
      handle.setAttribute("aria-valuetext", `Position ${Math.round(pct)} percent`);
    }

    slider.addEventListener("pointerdown", (e) => {
      dragging = true;
      slider.setPointerCapture(e.pointerId);
      setPosFromClientX(e.clientX);
      handle.focus({ preventScroll: true });
    });

    slider.addEventListener("pointermove", (e) => {
      if(!dragging) return;
      setPosFromClientX(e.clientX);
    });

    slider.addEventListener("pointerup", (e) => {
      dragging = false;
      try { slider.releasePointerCapture(e.pointerId); } catch {}
    });

    slider.addEventListener("pointercancel", () => { dragging = false; });

    handle.addEventListener("keydown", (e) => {
      const step = e.shiftKey ? 10 : 2;
      const current = parseFloat(getComputedStyle(slider).getPropertyValue("--pos")) || 50;

      if(e.key === "ArrowLeft"){
        e.preventDefault();
        slider.style.setProperty("--pos", clamp(current - step, 0, 100) + "%");
      }
      if(e.key === "ArrowRight"){
        e.preventDefault();
        slider.style.setProperty("--pos", clamp(current + step, 0, 100) + "%");
      }
      if(e.key === "Home"){
        e.preventDefault();
        slider.style.setProperty("--pos", "0%");
      }
      if(e.key === "End"){
        e.preventDefault();
        slider.style.setProperty("--pos", "100%");
      }
    });

    handle.addEventListener("click", (e) => e.preventDefault());
  </script>
</body>
</html>
